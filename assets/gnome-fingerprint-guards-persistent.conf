[Service]
# Per-user GNOME unlock workaround; no GDM greeter or PAM modifications.
# systemd recreates the private output directory before every GNOME start.
RuntimeDirectory=t480-gnome-fingerprint
RuntimeDirectoryMode=0700
# A helper failure must not prevent startup; missing overlays use stock code.
ExecStartPre=-/usr/bin/env -u G_RESOURCE_OVERLAYS /usr/bin/python3 -I "%h/.local/libexec/t480-gnome-fingerprint/gnome-fingerprint-guards.py" --directory "%t/t480-gnome-fingerprint"
Environment="G_RESOURCE_OVERLAYS=/org/gnome/shell/gdm/authServicesLegacy.js=%t/t480-gnome-fingerprint/authServicesLegacy.js"
