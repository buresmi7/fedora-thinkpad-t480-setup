# Prevent the Linux weak-host model from answering an ARP request for an
# address assigned to a different interface. NetworkManager can otherwise
# detect the laptop's Wi-Fi MAC as a conflict for its Ethernet address when
# both interfaces briefly connect to the same LAN during boot or resume.
net.ipv4.conf.all.arp_ignore = 1

# Use an address native to the outgoing interface in ARP requests, so a route
# transition cannot advertise the Ethernet address with the Wi-Fi MAC (or the
# Wi-Fi address with the Ethernet MAC).
net.ipv4.conf.all.arp_announce = 2
