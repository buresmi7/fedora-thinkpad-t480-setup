[Service]
# Runtime-only trial for org.gnome.Shell@user.service, not the GDM greeter.
# Failure must never stop the desktop from starting; a missing resource overlay
# falls back to the packaged resource. No fingerprint driver/PAM changes here.
ExecStartPre=-/usr/bin/env -u G_RESOURCE_OVERLAYS /usr/bin/python3 -I %t/t480-gnome-fingerprint-trial/prepare.py --directory %t/t480-gnome-fingerprint-trial
Environment="G_RESOURCE_OVERLAYS=/org/gnome/shell/gdm/authServicesLegacy.js=%t/t480-gnome-fingerprint-trial/authServicesLegacy.js"
